name: QIT Tests

on:
  push:
    branches: [ main, e2e-tests ]
  pull_request:
    branches: [ main, e2e-tests ]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install QIT CLI
        run: composer global require woocommerce/qit-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Install Plugin Dependencies
        run: npm install

      - name: Build Plugin Assets
        run: npm run build

      - name: Install Test Dependencies
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Start QIT Local Environment
        run: |
          # Start environment and capture the URL
          qit env:up -n > env_output.txt
          cat env_output.txt
          # Extract URL from output (e.g., http://localhost:32768)
          export WP_URL=$(grep -o "http://localhost:[0-9]*" env_output.txt | head -1)
          echo "WP_URL=$WP_URL" >> $GITHUB_ENV

      - name: Run Functional E2E Tests
        run: |
          cd tests/e2e
          npx playwright test
        env:
          WP_URL: ${{ env.WP_URL }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 30

      # -------------------------------------------------------------------
      # OPTIONAL: QIT Managed Tests (Security, PHPStan)
      # Requires a repo secret: QIT_TOKEN (Partner ID:Secret)
      # -------------------------------------------------------------------
      # - name: Run QIT Managed Security Scan
      #   if: env.QIT_TOKEN != ''
