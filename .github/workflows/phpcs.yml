name: PHP CodeSniffer

on: [push, pull_request]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install PHPCS Standards
        run: |
          # 1. Allow the installer plugin
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

          # 2. Install everything needed including PHPCompatibility
          composer global require "squizlabs/php_codesniffer:*" "wp-coding-standards/wpcs:*" "phpcsstandards/phpcsextra:*" "phpcsstandards/phpcsutils:*" "phpcompatibility/php-compatibility:*"

      - name: Run PHPCS (WordPress Standards)
        run: |
          PHPCS_BIN=$(composer global config bin-dir --absolute)/phpcs
          $PHPCS_BIN --standard=phpcs.xml.dist

      - name: Run PHP Compatibility Check (7.4-8.3)
        run: |
          PHPCS_BIN=$(composer global config bin-dir --absolute)/phpcs
          $PHPCS_BIN -p . --standard=PHPCompatibility --runtime-set testVersion 7.4-8.3 --extensions=php --ignore=vendor,node_modules,dist,build